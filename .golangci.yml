run:
  timeout: 3m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - gocritic
    - revive
  disable:
    - depguard
    - exhaustruct

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - hugeParam

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 5
